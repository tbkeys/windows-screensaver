<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>textures dev — every kind, 2×2 tiled</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #1b1b1b; color: #ddd; font: 12px/1.3 system-ui, sans-serif; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #grid { position: relative; display: grid; grid-template-columns: repeat(6, 200px); gap: 10px; padding: 10px; }
      .cell label { display: block; text-align: center; padding-top: 3px; white-space: nowrap; overflow: hidden; }
      .view { width: 200px; height: 200px; outline: 1px solid #3a3a3a; }
      #status { position: fixed; right: 10px; bottom: 6px; color: #888; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="grid"></div>
    <div id="status">generating…</div>
    <script type="module" src="./textures.js"></script>
  </body>
</html>

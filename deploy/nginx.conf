# nginx configuration for the built site (the contents of dist/).
#
# This is a complete nginx.conf, used verbatim by the Dockerfile. It runs as the
# unprivileged 'nginx' user: port 8080, pid and temp files under /tmp, logs to the
# container's stdout/stderr. Only `root` needs to change for a bare-metal install.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    absolute_redirect off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # gzip only: the stock nginx build has no brotli module, and the whole site is
    # a few hundred kB, so gzip is plenty.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Cache policy by final URI (after index / try_files internal redirects).
    # Vite writes hashed file names under assets/, so those are immutable; the HTML
    # that references them must always be revalidated.
    map $uri $cache_control {
        default      "public, max-age=3600";
        /            "no-cache";
        /healthz     "no-store";
        ~*\.html$    "no-cache";
        ~^/assets/   "public, max-age=31536000, immutable";
    }

    server {
        # IPv4 only: Docker maps the port, and `listen [::]:8080;` makes nginx refuse to
        # start on hosts whose kernel has IPv6 disabled. Add it for a dual-stack bare-metal install.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Headers are set once at server level on purpose: an add_header inside a
        # location would discard all of these for that location.
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # The app loads nothing from other origins. 'unsafe-inline' styles are needed by
        # lil-gui, which injects its stylesheet; data:/blob: cover uploaded textures,
        # screenshots and settings export. Loosen frame-ancestors to embed the maze.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
